# DentalYOLO26 v14 - v13 with lightweight coordinate injection before Detect.
# The v13 backbone and neck are unchanged. Independent CoordConv branches enrich
# P3/P4/P5 with normalized x/y coordinates without changing detection channels.

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone (identical to v13)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 9
  - [-1, 1, DAABLite, [1024, 21, 9]]             # 10 dental arch context

# Neck/head (layers 11-23 are identical to v13)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                   # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2ECA, [256, True]]                # 16 P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18 cat head P4
  - [-1, 2, C3k2, [512, True]]                   # 19 P4/16-medium
  - [-1, 1, C2StableSlot, [512, 1, 4, 2, 0.25]]  # 20 stable slot attention P4

  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 10], 1, Concat, [1]]                   # 22 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 23 P5/32-large

  # Coordinate-aware branches used only as Detect inputs.
  - [16, 1, CoordConv, [256, 1, 1]]              # 24 P3 coordinate injection
  - [20, 1, CoordConv, [512, 1, 1]]              # 25 P4 coordinate injection
  - [23, 1, CoordConv, [1024, 1, 1]]             # 26 P5 coordinate injection

  - [[24, 25, 26], 1, Detect, [nc]]              # 27 Detect(P3, P4, P5)
