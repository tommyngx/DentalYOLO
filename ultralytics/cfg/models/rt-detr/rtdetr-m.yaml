# Ultralytics RT-DETR-m (Medium) hybrid object detection model with P3/8 - P5/32 outputs
# Backbone: HGNetv2-M (smaller than L, between S and L variants)
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=rtdetr-m.yaml' will call rtdetr-m.yaml with scale 'm'
  # [depth, width, max_channels]
  m: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [28, 36]] # 0-P2/4
  - [-1, 6, HGBlock, [36, 104, 3]] # stage 1

  - [-1, 1, DWConv, [104, 3, 2, 1, False]] # 2-P3/8
  - [-1, 6, HGBlock, [72, 416, 3]] # stage 2

  - [-1, 1, DWConv, [416, 3, 2, 1, False]] # 4-P4/16
  - [-1, 6, HGBlock, [144, 832, 5, True, False]] # cm, c2, k, light, shortcut
  - [-1, 6, HGBlock, [144, 832, 5, True, True]] # stage 3

  - [-1, 1, DWConv, [832, 3, 2, 1, False]] # 7-P5/32
  - [-1, 6, HGBlock, [288, 1664, 5, True, False]] # stage 4

head:
  - [-1, 1, Conv, [208, 1, 1, None, 1, 1, False]] # 9 input_proj.2
  - [-1, 1, AIFI, [832, 8]]
  - [-1, 1, Conv, [208, 1, 1]] # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [6, 1, Conv, [208, 1, 1, None, 1, 1, False]] # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [208]] # 15, fpn_blocks.0
  - [-1, 1, Conv, [208, 1, 1]] # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [208, 1, 1, None, 1, 1, False]] # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [208]] # X3 (20), fpn_blocks.1

  - [-1, 1, Conv, [208, 3, 2]] # 21, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [208]] # F4 (23), pan_blocks.0

  - [-1, 1, Conv, [208, 3, 2]] # 24, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [208]] # F5 (26), pan_blocks.1

  - [[20, 23, 26], 1, RTDETRDecoder, [nc]] # RTDETRDecoder(P3, P4, P5)
