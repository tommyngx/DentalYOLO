# Ultralytics RT-DETR-m (Medium) hybrid object detection model with P3/8 - P5/32 outputs
# Backbone: HGNetv2-M (between L and X variants)
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=rtdetr-m.yaml' will call rtdetr-m.yaml with scale 'm'
  # [depth, width, max_channels]
  m: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [32, 56]] # 0-P2/4
  - [-1, 6, HGBlock, [56, 128, 3]] # stage 1

  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 2-P3/8
  - [-1, 6, HGBlock, [112, 512, 3]]
  - [-1, 6, HGBlock, [112, 512, 3, False, True]] # 4-stage 2

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 5-P4/16
  - [-1, 6, HGBlock, [224, 1024, 5, True, False]] # cm, c2, k, light, shortcut
  - [-1, 6, HGBlock, [224, 1024, 5, True, True]]
  - [-1, 6, HGBlock, [224, 1024, 5, True, True]]
  - [-1, 6, HGBlock, [224, 1024, 5, True, True]] # 9-stage 3

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 10-P5/32
  - [-1, 6, HGBlock, [448, 2048, 5, True, False]] # 11-stage 4

head:
  - [-1, 1, Conv, [320, 1, 1, None, 1, 1, False]] # 12 input_proj.2
  - [-1, 1, AIFI, [1536, 8]]
  - [-1, 1, Conv, [320, 1, 1]] # 14, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [9, 1, Conv, [320, 1, 1, None, 1, 1, False]] # 16 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [320]] # 18, fpn_blocks.0
  - [-1, 1, Conv, [320, 1, 1]] # 19, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [4, 1, Conv, [320, 1, 1, None, 1, 1, False]] # 21 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [320]] # X3 (23), fpn_blocks.1

  - [-1, 1, Conv, [320, 3, 2]] # 24, downsample_convs.0
  - [[-1, 19], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [320]] # F4 (26), pan_blocks.0

  - [-1, 1, Conv, [320, 3, 2]] # 27, downsample_convs.1
  - [[-1, 14], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [320]] # F5 (29), pan_blocks.1

  - [[23, 26, 29], 1, RTDETRDecoder, [nc]] # RTDETRDecoder(P3, P4, P5)
