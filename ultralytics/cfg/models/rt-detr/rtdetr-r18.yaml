# Ultralytics RT-DETR-r18 hybrid object detection model with P3/8 - P5/32 outputs
# Backbone: ResNet18 with BasicBlock (expansion=1)
# Reference: RT-DETRv2 r18vd configuration
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  s: [1.00, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ResNetLayer, [3, 64, 1, True, 1]] # 0 - stem (7x7 conv + maxpool)
  - [-1, 1, ResNetBasicLayer, [64, 64, 1, 2]] # 1 - layer1: 2 BasicBlocks, P2/4
  - [-1, 1, ResNetBasicLayer, [64, 128, 2, 2]] # 2 - layer2: 2 BasicBlocks, P3/8
  - [-1, 1, ResNetBasicLayer, [128, 256, 2, 2]] # 3 - layer3: 2 BasicBlocks, P4/16
  - [-1, 1, ResNetBasicLayer, [256, 512, 2, 2]] # 4 - layer4: 2 BasicBlocks, P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 5 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 7, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, RepC3, [256]] # 11, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 12, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 14 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, RepC3, [256]] # X3 (16), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 17, downsample_convs.0
  - [[-1, 12], 1, Concat, [1]] # cat Y4
  - [-1, 2, RepC3, [256]] # F4 (19), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 20, downsample_convs.1
  - [[-1, 7], 1, Concat, [1]] # cat Y5
  - [-1, 2, RepC3, [256]] # F5 (22), pan_blocks.1

  - [[16, 19, 22], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # RTDETRDecoder(P3, P4, P5) ndl=3
