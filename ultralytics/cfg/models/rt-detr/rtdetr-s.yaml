# Ultralytics RT-DETR-s (Small) hybrid object detection model with P3/8 - P5/32 outputs
# Backbone: HGNetv2-S (reduced from L variant)
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=rtdetr-s.yaml' will call rtdetr-s.yaml with scale 's'
  # [depth, width, max_channels]
  s: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [24, 32]] # 0-P2/4
  - [-1, 6, HGBlock, [32, 96, 3]] # stage 1

  - [-1, 1, DWConv, [96, 3, 2, 1, False]] # 2-P3/8
  - [-1, 6, HGBlock, [64, 384, 3]] # stage 2

  - [-1, 1, DWConv, [384, 3, 2, 1, False]] # 4-P4/16
  - [-1, 6, HGBlock, [128, 768, 5, True, False]] # cm, c2, k, light, shortcut
  - [-1, 6, HGBlock, [128, 768, 5, True, True]] # stage 3

  - [-1, 1, DWConv, [768, 3, 2, 1, False]] # 7-P5/32
  - [-1, 6, HGBlock, [256, 1536, 5, True, False]] # stage 4

head:
  - [-1, 1, Conv, [192, 1, 1, None, 1, 1, False]] # 9 input_proj.2
  - [-1, 1, AIFI, [768, 8]]
  - [-1, 1, Conv, [192, 1, 1]] # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [6, 1, Conv, [192, 1, 1, None, 1, 1, False]] # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [192]] # 15, fpn_blocks.0
  - [-1, 1, Conv, [192, 1, 1]] # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [192, 1, 1, None, 1, 1, False]] # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [192]] # X3 (20), fpn_blocks.1

  - [-1, 1, Conv, [192, 3, 2]] # 21, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [192]] # F4 (23), pan_blocks.0

  - [-1, 1, Conv, [192, 3, 2]] # 24, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [192]] # F5 (26), pan_blocks.1

  - [[20, 23, 26], 1, RTDETRDecoder, [nc]] # RTDETRDecoder(P3, P4, P5)
