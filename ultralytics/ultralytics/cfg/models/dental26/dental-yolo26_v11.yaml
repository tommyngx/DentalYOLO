# DentalYOLO26 v11 - DAAB-lite-YOLO26.
# Starts from cfg/models/26/yolo26.yaml and inserts one DAAB-lite block in the backbone.
# DAAB-lite already contains a lightweight Triplet Attention stage, and one extra Triplet block is used at P3 neck.
# The SPPF block and YOLO26 Detect head module are unchanged.

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 8
  - [-1, 1, DAABLite, [1024, 31, 15]]            # 9 dental arch attention, single backbone use
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 10
  - [-1, 2, C2PSA, [1024]]                       # 11

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, Concat, [1]]                    # 13 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                   # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                    # 16 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                   # 17 P3/8-small
  - [-1, 1, TripletAttention, [256]]             # 18 neck P3 attention

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 14], 1, Concat, [1]]                   # 20 cat head P4
  - [-1, 2, C3k2, [512, True]]                   # 21 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 11], 1, Concat, [1]]                   # 23 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 24 P5/32-large

  - [[18, 21, 24], 1, Detect, [nc]]              # 25 Detect(P3, P4, P5)
